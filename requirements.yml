---
# Canonical Ansible collection requirements.
# Installed by installation/install.sh. `collections/requirements.yml` is a
# compatibility symlink to this file so older commands keep working.
collections:
  - name: ansible.posix
    version: '>=1.6.0,<3.0.0'
  - name: community.docker
    version: '>=4.0.0,<6.0.0'
  - name: community.general
    version: '>=10.0.0,<14.0.0'
  - name: community.postgresql
    version: '>=3.10.0,<5.0.0'
