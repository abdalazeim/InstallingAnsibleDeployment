---
# Read-only connectivity check for the Semaphore API.
# Usage:
#   export SEMAPHORE_API_TOKEN='...'
#   ansible-playbook playbooks/semaphore/check_api.yml \
#     -e semaphore_url=http://127.0.0.1:3000 -e semaphore_project_id=1
- name: Verify Semaphore API connectivity
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    semaphore_api_token: "{{ lookup('env', 'SEMAPHORE_API_TOKEN') }}"
  tasks:
    - name: Validate inputs
      ansible.builtin.assert:
        that:
          - semaphore_url is defined
          - semaphore_url is match('^https://[^/]+')
            or semaphore_url is match('^http://(127\.0\.0\.1|localhost|\[::1\])(:[0-9]+)?/?$')
          - semaphore_api_token | length > 0
        fail_msg: >-
          Provide semaphore_url (HTTPS or loopback HTTP) and export
          SEMAPHORE_API_TOKEN. The token is never printed.
        quiet: true

    - name: Read server information
      ansible.builtin.uri:
        url: "{{ semaphore_url | regex_replace('/$', '') }}/api/info"
        method: GET
        headers:
          Authorization: "Bearer {{ semaphore_api_token }}"
        status_code: 200
        return_content: true
        validate_certs: true
      register: semaphore_info
      changed_when: false
      no_log: true

    - name: Read project templates
      ansible.builtin.uri:
        url: "{{ semaphore_url | regex_replace('/$', '') }}/api/project/{{ semaphore_project_id }}/templates"
        method: GET
        headers:
          Authorization: "Bearer {{ semaphore_api_token }}"
        status_code: 200
        return_content: true
        validate_certs: true
      register: semaphore_templates
      changed_when: false
      no_log: true
      when: semaphore_project_id is defined

    - name: Display non-secret summary
      ansible.builtin.debug:
        msg:
          server_version: "{{ semaphore_info.json.version | default('unknown') }}"
          project_id: "{{ semaphore_project_id | default('not requested') }}"
          templates: >-
            {{ (semaphore_templates.json | length)
               if (semaphore_templates is defined and semaphore_templates.json is defined)
               else 'not requested' }}

- name: Validate target selection
  import_playbook: ../_guard.yml
