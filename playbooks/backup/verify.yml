---
- name: Backup - Verify
  hosts: '{{ target_hosts | default("all") }}'
  gather_facts: true
  become: true
  any_errors_fatal: true
  vars:
    operation_id: backup.verify
    operation_risk: read
  pre_tasks:
  - name: Apply execution policy
    ansible.builtin.import_role:
      name: common
  tasks:
  - name: Backup - Verify
    ansible.builtin.include_role:
      name: backup
      tasks_from: verify
