---
- name: Backup - Odoo
  hosts: '{{ target_hosts | default("all") }}'
  gather_facts: true
  become: true
  any_errors_fatal: true
  vars:
    operation_id: backup.odoo
    operation_risk: change
  pre_tasks:
  - name: Apply execution policy
    ansible.builtin.import_role:
      name: common
  tasks:
  - name: Backup - Odoo
    ansible.builtin.include_role:
      name: backup
      tasks_from: odoo
