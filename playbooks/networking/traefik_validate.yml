---
- name: Traefik - Configuration Validation
  hosts: '{{ target_hosts | default("all") }}'
  gather_facts: true
  become: true
  any_errors_fatal: true
  vars:
    operation_id: networking.traefik_validate
    operation_risk: read
  pre_tasks:
  - name: Apply execution policy
    ansible.builtin.import_role:
      name: common
  tasks:
  - name: Traefik - Configuration Validation
    ansible.builtin.include_role:
      name: networking
      tasks_from: traefik_validate

- name: Validate target selection
  import_playbook: ../_guard.yml
