---
- name: Traefik - Deploy
  hosts: '{{ target_hosts | default("all") }}'
  gather_facts: true
  become: true
  any_errors_fatal: true
  vars:
    operation_id: networking.traefik_deploy
    operation_risk: change
  pre_tasks:
  - name: Apply execution policy
    ansible.builtin.import_role:
      name: common
  tasks:
  - name: Traefik - Deploy
    ansible.builtin.include_role:
      name: networking
      tasks_from: traefik_deploy
