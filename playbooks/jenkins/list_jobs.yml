---
- name: Jenkins - List Jobs
  hosts: '{{ target_hosts | default("all") }}'
  gather_facts: true
  become: false
  any_errors_fatal: true
  vars:
    operation_id: jenkins.list_jobs
    operation_risk: read
  pre_tasks:
  - name: Apply execution policy
    ansible.builtin.import_role:
      name: common
  tasks:
  - name: Jenkins - List Jobs
    ansible.builtin.include_role:
      name: jenkins
      tasks_from: list_jobs
