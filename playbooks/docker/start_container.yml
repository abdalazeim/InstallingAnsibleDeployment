---
- name: Docker - Start Container
  hosts: '{{ target_hosts | default("all") }}'
  gather_facts: true
  become: true
  any_errors_fatal: true
  vars:
    operation_id: docker.start_container
    operation_risk: change
  pre_tasks:
  - name: Apply execution policy
    ansible.builtin.import_role:
      name: common
  tasks:
  - name: Docker - Start Container
    ansible.builtin.include_role:
      name: docker
      tasks_from: start_container
