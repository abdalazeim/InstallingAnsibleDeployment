---
- name: Docker - Resource Usage
  hosts: '{{ target_hosts | default("all") }}'
  gather_facts: true
  become: true
  any_errors_fatal: true
  vars:
    operation_id: docker.resource_usage
    operation_risk: read
  pre_tasks:
  - name: Apply execution policy
    ansible.builtin.import_role:
      name: common
  tasks:
  - name: Docker - Resource Usage
    ansible.builtin.include_role:
      name: docker
      tasks_from: resource_usage
