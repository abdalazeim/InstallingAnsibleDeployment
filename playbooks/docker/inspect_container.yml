---
- name: Docker - Inspect Container
  hosts: '{{ target_hosts | default("all") }}'
  gather_facts: true
  become: true
  any_errors_fatal: true
  vars:
    operation_id: docker.inspect_container
    operation_risk: read
  pre_tasks:
  - name: Apply execution policy
    ansible.builtin.import_role:
      name: common
  tasks:
  - name: Docker - Inspect Container
    ansible.builtin.include_role:
      name: docker
      tasks_from: inspect_container
