---
- name: System - SSH Status
  hosts: '{{ target_hosts | default("all") }}'
  gather_facts: true
  become: true
  any_errors_fatal: true
  vars:
    operation_id: system.ssh_status
    operation_risk: read
  pre_tasks:
  - name: Apply execution policy
    ansible.builtin.import_role:
      name: common
  tasks:
  - name: System - SSH Status
    ansible.builtin.include_role:
      name: system
      tasks_from: ssh_status
