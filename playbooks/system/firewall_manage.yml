---
- name: System - Firewall Management
  hosts: '{{ target_hosts | default("all") }}'
  gather_facts: true
  become: true
  any_errors_fatal: true
  vars:
    operation_id: system.firewall_manage
    operation_risk: destructive
  pre_tasks:
  - name: Apply execution policy
    ansible.builtin.import_role:
      name: common
  tasks:
  - name: System - Firewall Management
    ansible.builtin.include_role:
      name: system
      tasks_from: firewall_manage
