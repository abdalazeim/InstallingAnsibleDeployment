---
- name: Monitoring - Infrastructure Overview
  hosts: '{{ target_hosts | default("all") }}'
  gather_facts: true
  become: false
  any_errors_fatal: true
  vars:
    operation_id: monitoring.overview
    operation_risk: read
  pre_tasks:
  - name: Apply execution policy
    ansible.builtin.import_role:
      name: common
  tasks:
  - name: Monitoring - Infrastructure Overview
    ansible.builtin.include_role:
      name: monitoring
      tasks_from: overview
