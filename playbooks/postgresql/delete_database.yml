---
- name: PostgreSQL - Delete Database
  hosts: '{{ target_hosts | default("all") }}'
  gather_facts: true
  become: true
  any_errors_fatal: true
  vars:
    operation_id: postgresql.delete_database
    operation_risk: destructive
  pre_tasks:
  - name: Apply execution policy
    ansible.builtin.import_role:
      name: common
  tasks:
  - name: PostgreSQL - Delete Database
    ansible.builtin.include_role:
      name: postgresql
      tasks_from: delete_database
