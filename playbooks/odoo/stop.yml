---
- name: Odoo - Stop Instance
  hosts: '{{ target_hosts | default("all") }}'
  gather_facts: true
  become: true
  any_errors_fatal: true
  vars:
    operation_id: odoo.stop
    operation_risk: change
  pre_tasks:
  - name: Apply execution policy
    ansible.builtin.import_role:
      name: common
  tasks:
  - name: Odoo - Stop Instance
    ansible.builtin.include_role:
      name: odoo
      tasks_from: stop
