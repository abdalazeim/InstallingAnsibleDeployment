---
- name: Odoo - List Instances
  hosts: '{{ target_hosts | default("all") }}'
  gather_facts: true
  become: false
  any_errors_fatal: true
  vars:
    operation_id: odoo.list_instances
    operation_risk: read
  pre_tasks:
  - name: Apply execution policy
    ansible.builtin.import_role:
      name: common
  tasks:
  - name: Odoo - List Instances
    ansible.builtin.include_role:
      name: odoo
      tasks_from: list_instances
