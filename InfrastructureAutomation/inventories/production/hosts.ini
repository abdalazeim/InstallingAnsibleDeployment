---
# Production inventory — replace with real hosts. No secrets in plain text.
[local]
localhost ansible_connection=local ansible_user=odoo

[odoo_servers]
odoo17-prod ansible_host=10.0.20.10 ansible_user=deploy ansible_port=22
odoo19-prod ansible_host=10.0.20.20 ansible_user=deploy ansible_port=22

[web_servers]
web-prod ansible_host=10.0.20.30 ansible_user=deploy

[db_servers]
db-prod ansible_host=10.0.20.40 ansible_user=deploy

[ci_servers]
jenkins-prod ansible_host=10.0.20.50 ansible_user=deploy

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'