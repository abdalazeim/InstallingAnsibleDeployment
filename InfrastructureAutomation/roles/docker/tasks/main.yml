---
# Docker role: engine, compose, containers, networks
- name: Install Docker prerequisites
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present

- name: Add Docker GPG key
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Add Docker repository
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    update_cache: true

- name: Install Docker engine
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Add users to docker group
  user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users | default([]) }}"

- name: Configure Docker daemon
  template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    mode: '0644'
  notify: restart docker

- name: Ensure Docker service is running
  service:
    name: docker
    state: started
    enabled: true

- name: Create Docker networks
  docker_network:
    name: "{{ item.name }}"
    driver: "{{ item.driver | default('bridge') }}"
    ipam_config:
      - subnet: "{{ item.subnet | default('') }}"
    state: present
  loop: "{{ docker_networks | default([]) }}"

- name: Manage Docker containers
  docker_container:
    name: "{{ item.name }}"
    image: "{{ item.image }}"
    state: "{{ item.state | default('started') }}"
    ports: "{{ item.ports | default([]) }}"
    volumes: "{{ item.volumes | default([]) }}"
    env: "{{ item.env | default({}) }}"
    networks:
      - name: "{{ item.network | default('bridge') }}"
    restart_policy: "{{ item.restart_policy | default('always') }}"
    log_driver: json-file
    log_opt:
      max-size: "10m"
      max-file: "3"
  loop: "{{ docker_containers | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

- name: Prune unused Docker resources
  docker_prune:
    all: true
    containers: true
    images: true
    volumes: false
    networks: false
  when: docker_prune | default(false)

- name: Display Docker info
  command: docker info
  register: docker_info
  changed_when: false

- name: Show Docker info
  debug:
    var: docker_info.stdout_lines