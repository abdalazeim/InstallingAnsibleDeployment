---
# Development inventory
[local]
localhost ansible_connection=local ansible_user=odoo

[odoo_servers]
# odoo-dev ansible_host=10.0.0.10 ansible_user=deploy ansible_port=22

[web_servers]
# web-dev ansible_host=10.0.0.20 ansible_user=deploy

[db_servers]
# db-dev ansible_host=10.0.0.30 ansible_user=deploy

[ci_servers]
# jenkins ansible_host=10.0.0.40 ansible_user=deploy

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'