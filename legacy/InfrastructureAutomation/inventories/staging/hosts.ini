---
# Staging inventory
[local]
localhost ansible_connection=local ansible_user=odoo

[odoo_servers]
odoo-staging ansible_host=10.0.10.10 ansible_user=deploy ansible_port=22

[web_servers]
web-staging ansible_host=10.0.10.20 ansible_user=deploy

[db_servers]
db-staging ansible_host=10.0.10.30 ansible_user=deploy

[ci_servers]
jenkins-staging ansible_host=10.0.10.40 ansible_user=deploy

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'