---
# Build inventory used by installation verification and Semaphore smoke tests.
# `localhost` is the machine running Ansible. On a bare-metal Ubuntu install
# this is the Ubuntu host. Inside a containerized Semaphore runner it is the
# runner container, which is not a supported Ubuntu target: replace this host
# with an SSH target before enabling the Semaphore build smoke test.
all:
  vars:
    infrastructure_environment: build
  children:
    managed:
      hosts:
        localhost:
          ansible_connection: local
