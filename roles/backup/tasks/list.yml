---
- name: Execute verified file backup operation
  infrastructure_archive:
    action: list
    backup_root: '{{ backup_root }}/files'
    source: '{{ backup_source | default('''') }}'
    backup_id: '{{ backup_id | default('''') }}'
    destination: '{{ restore_destination | default('''') }}'
    retention_days: '{{ retention_days }}'
    confirmed: '{{ confirm_destructive_operation | bool }}'
  register: backup_result
- name: Display backup operation result
  ansible.builtin.debug:
    var: backup_result
