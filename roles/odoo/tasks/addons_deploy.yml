---
- name: Validate operation inputs
  ansible.builtin.assert:
    that:
    - odoo_instance is defined
    - addons_repository is defined
    - addons_revision is defined
    fail_msg: Invalid or incomplete operation inputs
    quiet: true
- name: Validate operation inputs
  ansible.builtin.assert:
    that:
    - odoo_instance in odoo_instances
    fail_msg: Invalid or incomplete operation inputs
    quiet: true
- name: Select isolated Odoo instance
  ansible.builtin.set_fact:
    odoo: '{{ odoo_instances[odoo_instance] }}'
  no_log: true
- name: Validate operation inputs
  ansible.builtin.assert:
    that:
    - odoo.mode in ['docker','native']
    - odoo.database is match('^[A-Za-z_][A-Za-z0-9_-]{0,62}$')
    fail_msg: Invalid or incomplete operation inputs
    quiet: true
- name: Validate operation inputs
  ansible.builtin.assert:
    that:
    - addons_repository is match("^(https://|ssh://)")
    - addons_revision | length > 0
    fail_msg: Invalid or incomplete operation inputs
    quiet: true
- name: Back up current addons
  infrastructure_archive:
    action: backup
    source: '{{ odoo.addons_path }}'
    backup_root: '{{ backup_root }}/odoo/{{ odoo_instance }}/addons'
- name: Update addon repository without discarding local changes
  ansible.builtin.git:
    repo: '{{ addons_repository }}'
    version: '{{ addons_revision }}'
    dest: '{{ odoo.addons_path }}'
    force: false
    accept_hostkey: false
- name: Validate deployed addons
  infrastructure_addons:
    path: '{{ odoo.addons_path }}'
- name: Restart selected instance
  ansible.builtin.include_tasks:
    file: restart.yml
