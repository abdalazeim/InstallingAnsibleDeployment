---
- name: Validate operation inputs
  ansible.builtin.assert:
    that:
    - upgrade_type | default('safe') in ['safe','dist','no']
    fail_msg: Invalid or incomplete operation inputs
    quiet: true
- name: Refresh APT and upgrade requested packages
  ansible.builtin.apt:
    update_cache: '{{ update_cache | default(true) | bool }}'
    cache_valid_time: 3600
    upgrade: '{{ upgrade_type | default(''safe'') }}'
- name: Check reboot marker
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_marker
- name: Report reboot requirement
  ansible.builtin.debug:
    msg:
      reboot_required: '{{ reboot_marker.stat.exists }}'
- name: Reboot only when explicitly approved
  ansible.builtin.reboot:
    reboot_timeout: 600
  when: reboot_marker.stat.exists and confirm_reboot | bool
