---
- name: Read Docker state
  ansible.builtin.command:
    argv:
    - docker
    - stats
    - --no-stream
    - --format
    - json
  changed_when: false
  no_log: false
  register: docker_result
  check_mode: false
- name: Display Docker state
  ansible.builtin.debug:
    var: docker_result.stdout_lines
