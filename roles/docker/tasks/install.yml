---
- name: Install repository prerequisites
  ansible.builtin.apt:
    name:
    - ca-certificates
    - curl
    state: present
    update_cache: true
- name: Create apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
- name: Fetch official Docker signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
- name: Configure official Docker repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts.architecture] }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts.distribution_release }} stable"
    filename: docker
    state: present
- name: Install Docker engine and plugins
  ansible.builtin.apt:
    name:
    - docker-ce
    - docker-ce-cli
    - containerd.io
    - docker-buildx-plugin
    - docker-compose-plugin
    state: present
    update_cache: true
- name: Enable Docker service
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
