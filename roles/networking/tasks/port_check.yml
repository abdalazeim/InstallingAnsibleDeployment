---
- name: Validate operation inputs
  ansible.builtin.assert:
    that:
    - network_host is defined
    - network_port is defined
    fail_msg: Invalid or incomplete operation inputs
    quiet: true
- name: Validate operation inputs
  ansible.builtin.assert:
    that:
    - network_port | int > 0
    - network_port | int < 65536
    fail_msg: Invalid or incomplete operation inputs
    quiet: true
- name: Check TCP connectivity
  ansible.builtin.wait_for:
    host: '{{ network_host }}'
    port: '{{ network_port | int }}'
    timeout: 10
  check_mode: false
