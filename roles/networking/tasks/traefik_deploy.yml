---
- name: Validate operation inputs
  ansible.builtin.assert:
    that:
    - traefik_directory is defined
    - traefik_version is defined
    - traefik_acme_email is defined
    fail_msg: Invalid or incomplete operation inputs
    quiet: true
- name: Validate operation inputs
  ansible.builtin.assert:
    that:
    - traefik_directory is match('^/(opt|srv)/[A-Za-z0-9_/-]+$')
    - traefik_version is match('^v3\.[0-9]+\.[0-9]+$')
    - traefik_acme_email is defined
    - traefik_routes is mapping
    - traefik_services is mapping
    fail_msg: Invalid or incomplete operation inputs
    quiet: true
- name: Create proxy directory
  ansible.builtin.file:
    path: '{{ traefik_directory }}'
    state: directory
    mode: '0700'
- name: Create protected certificate storage
  ansible.builtin.copy:
    content: ''
    dest: '{{ traefik_directory }}/acme.json'
    mode: '0600'
    force: false
- name: Render proxy configuration with backups
  ansible.builtin.template:
    src: '{{ item }}.j2'
    dest: '{{ traefik_directory }}/{{ item }}'
    mode: '0600'
    backup: true
  loop:
  - compose.yaml
  - traefik.yml
  - dynamic.yml
- name: Validate generated Compose configuration
  ansible.builtin.command:
    argv:
    - docker
    - compose
    - --project-directory
    - '{{ traefik_directory }}'
    - config
    - --quiet
  changed_when: false
  no_log: false
  check_mode: false
- name: Deploy Traefik
  community.docker.docker_compose_v2:
    project_src: '{{ traefik_directory }}'
    project_name: '{{ traefik_project | default(''infrastructure-proxy'') }}'
    state: present
    wait: true
    wait_timeout: 120
